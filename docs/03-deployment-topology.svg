ilder: dependencies in venv</text><text x="920.0" y="323" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">runtime: python:3.12-slim</text><text x="920.0" y="345" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">non-root user 10001</text><rect x="1360" y="240" width="440" height="125" rx="12" fill="#e8f1ff" stroke="#4a74b8" stroke-width="2"/><text x="1580.0" y="269" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e293b" font-weight="700" text-anchor="middle">Artifact Registry</text><text x="1580.0" y="294" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">repository: changelens</text><text x="1580.0" y="316" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">Docker image</text><rect x="950" y="600" width="880" height="330" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="970" y="630" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569" font-weight="700" text-anchor="start">Cloud Run service: changelens</text><rect x="990" y="660" width="800" height="215" rx="12" fill="#e8f1ff" stroke="#4a74b8" stroke-width="2"/><text x="1390.0" y="689" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e293b" font-weight="700" text-anchor="middle">Container</text><text x="1390.0" y="714" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">uvicorn --host 0.0.0.0 --port PORT (8080)</text><text x="1390.0" y="736" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">unauthenticated access</text><text x="1390.0" y="758" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">max instances 1 • request t